<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vivero Raíz">
    <defs>
        <clipPath id="circulo">
            <circle cx="50" cy="50" r="46"/>
        </clipPath>
        <path id="hoja" d="M0 0 C5 -5.5 14 -5.5 19 0 C14 5.5 5 5.5 0 0 Z"/>
    </defs>

    <!-- Fondo: cielo -->
    <circle cx="50" cy="50" r="46" fill="#F7F3EA"/>

    <g clip-path="url(#circulo)">
        <!-- Sol -->
        <circle cx="69" cy="30" r="10" fill="#E35B6B"/>

        <!-- Campo de atrás -->
        <path d="M0 64 Q 25 55 50 61 T 100 57 L100 100 L0 100 Z" fill="#8DAE91"/>

        <!-- Campo de adelante, con surcos -->
        <path d="M0 73 Q 30 65 60 71 T 100 69 L100 100 L0 100 Z" fill="#1F4A3A"/>
        <path d="M-5 81 Q 35 74 105 79" fill="none" stroke="#2F6B4F" stroke-width="1.6"/>
        <path d="M-5 89 Q 40 82 105 87" fill="none" stroke="#2F6B4F" stroke-width="1.6"/>
    </g>

    <!-- Planta -->
    <g fill="#1F4A3A">
        <use href="#hoja" transform="translate(50 63) rotate(-166) scale(1.05)"/>
        <use href="#hoja" transform="translate(50 63) rotate(-14) scale(1.05)"/>
        <use href="#hoja" transform="translate(50 63) rotate(-134) scale(1.25)" fill="#2F6B4F"/>
        <use href="#hoja" transform="translate(50 63) rotate(-46) scale(1.25)" fill="#2F6B4F"/>
        <use href="#hoja" transform="translate(50 64) rotate(-90) scale(1.4)"/>
    </g>

    <!-- Maceta -->
    <path d="M39.5 67 L60.5 67 L57.5 84 Q57 86 55 86 L45 86 Q43 86 42.5 84 Z" fill="#D98A93"/>
    <rect x="37" y="62.5" width="26" height="5.5" rx="1.5" fill="#C27480"/>

    <!-- Borde -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#121815" stroke-width="3"/>
</svg>