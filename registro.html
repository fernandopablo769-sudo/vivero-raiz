<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vivero Raíz - Crear Cuenta</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div><a href="index.html">VIVERO RAÍZ</a></div>
        <nav>
            <ul>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Ingresar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Crear cuenta</h1>
        <p>Los campos marcados con * son obligatorios.</p>
        
        <form action="#" method="POST">
            <!-- Primer grupo de datos -->
            <fieldset>
                <legend>Datos Personales</legend>
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" required>
                
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" required>
                
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono">
            </fieldset>

            <!-- Segundo grupo de datos -->
            <fieldset>
                <legend>Datos de la Cuenta</legend>
                <label for="correo-reg">Correo electrónico *</label>
                <input type="email" id="correo-reg" name="correo-reg" required>
                
                <label for="pass-reg">Contraseña *</label>
                <input type="password" id="pass-reg" name="pass-reg" minlength="8" required>
                
                <label for="pass-rep">Repetir contraseña *</label>
                <input type="password" id="pass-rep" name="pass-rep" minlength="8" required>
            </fieldset>

            <button type="submit" class="boton">Crear Cuenta</button>
        </form>
        <p>¿Ya tenés cuenta? <a href="login.html">Ingresá acá</a></p>
    </main>

    <footer>
        <p>© 2026 Vivero Raíz — Trabajo Práctico Integrador</p>
    </footer>

</body>
</html>
